org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.overridePathCheck=true
kotlin.incremental=false
kotlin.incremental.jvm=false

# ---- Gradle 性能开关（对齐 course_helper 的实测结论）----
# 构建缓存：命中时直接复用上次的 task 输出，跳过重编译。
# 需要 CI 侧用 setup-java 的 cache:gradle 持久化 ~/.gradle/caches
# （build-cache-1 就在里面）才能跨 run 命中。
org.gradle.caching=true
# 并行执行任务。
org.gradle.parallel=true
